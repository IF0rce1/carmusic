<body>
    <div id="carmusic" style = "display:none;">
        <h1>ASCULTĂ MELODIA<p>TA FAVORITĂ</p></h1>

            <input placeholder="Adaugă linkul tău aici" id="youtubeLink"></input>
            <button id="playButton">PORNEȘTE</button>

    </div>
